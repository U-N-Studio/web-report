appId: com.webreport.app
productName: Web Report
directories:
  output: dist-electron
  app: .
files:
  - dist/**/*
  - dist-electron/**/*
  - backend/**/*
  - "!backend/__pycache__"
extraResources:
  - from: backend
    to: python
mac:
  target: dmg
  category: public.app-category.utilities
win:
  target: nsis
linux:
  target: AppImage
